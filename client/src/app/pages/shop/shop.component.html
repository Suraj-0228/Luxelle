<!-- Page Header -->
<div class="bg-gray-900 text-white my-5 py-20 relative overflow-hidden">
    <div class="absolute inset-0 opacity-20">
        <img src="https://images.unsplash.com/photo-1441984904996-e0b6ba687e04?w=1600&auto=format&fit=crop&q=80"
            class="w-full h-full object-cover">
    </div>
    <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <h1 class="text-4xl md:text-5xl font-serif font-bold mb-4">Our Collection</h1>
        <div class="flex items-center justify-center space-x-2 text-sm text-gray-400 uppercase tracking-widest">
            <a routerLink="/" class="hover:text-white transition-colors">Home</a>
            <span>/</span>
            <span class="text-white">Shop</span>
        </div>
    </div>
</div>

<!-- Main Content -->
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">

    <!-- Filter Bar -->
    <div class="bg-gray-50 border border-gray-200 p-6 rounded-sm mb-10">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">

            <!-- Search -->
            <div class="md:col-span-12 lg:col-span-6 relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <input type="text" [value]="searchQuery" (input)="onSearch($any($event.target).value)"
                    placeholder="Search products..."
                    class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-sm leading-5 bg-white placeholder-gray-500 focus:outline-none focus:placeholder-gray-400 focus:ring-1 focus:ring-gray-900 sm:text-sm transition-shadow">
            </div>

            <!-- Category Filter -->
            <div class="md:col-span-6 lg:col-span-3 relative">
                <select [value]="selectedCategory" (change)="onCategoryChange($any($event.target).value)"
                    class="block w-full pl-4 pr-10 py-3 text-sm border border-gray-300 focus:border-gray-900 focus:ring-1 focus:ring-gray-900 focus:outline-none rounded-sm bg-white cursor-pointer appearance-none transition-colors">
                    <option *ngFor="let cat of categories" [value]="cat">
                        {{ cat === 'All' ? 'All Categories' : cat }}
                    </option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </div>
            </div>

            <!-- Price Filter -->
            <div class="md:col-span-6 lg:col-span-3 relative">
                <select [value]="selectedPriceRange" (change)="onPriceChange($any($event.target).value)"
                    class="block w-full pl-4 pr-10 py-3 text-sm border border-gray-300 focus:border-gray-900 focus:ring-1 focus:ring-gray-900 focus:outline-none rounded-sm bg-white cursor-pointer appearance-none transition-colors">
                    <option *ngFor="let range of priceRanges" [value]="range.value">{{ range.label }}</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </div>
            </div>

        </div>

        <div class="mt-4 flex justify-between items-center text-xs text-gray-500 border-t border-gray-200 pt-4">
            <span>Showing {{ paginatedProducts.length }} of {{ products.length }} results</span>
            <span *ngIf="selectedCategory !== 'All' || selectedPriceRange !== 'All' || searchQuery"
                class="text-primary-600 font-medium">Filters applied</span>
        </div>
    </div>

    <!-- Product Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-x-8 gap-y-12">
        <app-product-card *ngFor="let product of paginatedProducts"
            class="pb-5 hover:shadow-xl hover:-translate-y-1 cursor-pointer transition-all duration-300"
            [product]="product"></app-product-card>
    </div>

    <!-- Pagination -->
    <div *ngIf="totalPages > 1" class="flex justify-center mt-16">
        <nav class="flex items-center space-x-2">
            <button (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1"
                class="px-4 py-2 border border-gray-300 text-sm font-medium rounded-sm text-gray-700 bg-white hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                Previous
            </button>

            <button *ngFor="let page of pageNumbers" (click)="changePage(page)"
                [class.bg-gray-900]="currentPage === page" [class.text-white]="currentPage === page"
                [class.border-gray-900]="currentPage === page" [class.text-gray-700]="currentPage !== page"
                [class.hover:bg-gray-50]="currentPage !== page"
                class="px-4 py-2 border border-gray-300 text-sm font-medium rounded-sm transition-colors">
                {{ page }}
            </button>

            <button (click)="changePage(currentPage + 1)" [disabled]="currentPage === totalPages"
                class="px-4 py-2 border border-gray-300 text-sm font-medium rounded-sm text-gray-700 bg-white hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                Next
            </button>
        </nav>
    </div>

    <!-- Empty State -->
    <div *ngIf="products.length === 0" class="text-center py-24">
        <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
            </svg>
        </div>
        <h3 class="text-lg font-serif font-bold text-gray-900 mb-2">No products found</h3>
        <p class="text-gray-500">Try selecting a different category.</p>
    </div>
</div>
