<!-- Latest Products Page Banner -->
<div class="relative bg-gray-100 py-16 sm:py-24 mt-5">
    <div class="absolute inset-0 overflow-hidden">
        <img src="https://images.unsplash.com/photo-1445205170230-053b83016050?q=80&w=2071&auto=format&fit=crop"
            alt="Latest Collection Banner" class="w-full h-full object-cover opacity-20 filter grayscale">
        <div class="absolute inset-0 bg-gradient-to-r from-gray-900/80 to-gray-900/60 mix-blend-multiply"></div>
    </div>
    <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center flex flex-col items-center">
        <span class="text-white font-bold tracking-[0.3em] text-xs uppercase mb-4 animate-[fadeIn_1s_ease-out]">
            New Arrivals
        </span>
        <h1 class="text-4xl sm:text-5xl md:text-6xl font-serif font-bold text-white mb-6 drop-shadow-md">
            Latest Arrival Products
        </h1>
        <p class="mt-4 max-w-2xl text-lg sm:text-xl text-gray-200 font-light">
            Discover the newest additions to our curated selection of luxury fashion.
        </p>
    </div>
</div>

<!-- Products Grid Area -->
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
    <!-- Grid -->
    <div *ngIf="paginatedProducts.length > 0; else noProducts"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-x-8 gap-y-12">
        <div *ngFor="let product of paginatedProducts" class="pb-5 hover:shadow-xl hover:-translate-y-1 cursor-pointer transition-all duration-300 animate-fade-in-up">
            <app-product-card [product]="product"></app-product-card>
        </div>
    </div>

    <!-- Empty State -->
    <ng-template #noProducts>
        <div class="text-center py-20 bg-gray-50 border border-gray-100 rounded-lg">
            <svg class="mx-auto h-16 w-16 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                    d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
            </svg>
            <h3 class="mt-4 text-lg font-serif font-medium text-gray-900">No products found</h3>
            <p class="mt-2 text-sm text-gray-500 font-light">Check back later for new arrivals.</p>
        </div>
    </ng-template>

</div>
